services:
  - type: web
    name: jackson-rotich-portfolio
    runtime: node
    plan: free
    buildCommand: pnpm install --prod --frozen-lockfile --ignore-scripts
    startCommand: node --env-file-if-exists=.env server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        value: JACKSONKIPCHUMBA001@gmail.com
      - key: CONTACT_FROM
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
